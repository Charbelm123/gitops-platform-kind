# Argo CD does not assess the health of child Applications by default, so sync waves in an
# app-of-apps don't actually wait: wave 3 starts while wave 1 is still installing CRDs.
# This health check makes a child Application count as healthy only when it really is.
data:
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end
    return hs
