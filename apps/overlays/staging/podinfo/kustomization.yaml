apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: podinfo-staging
resources:
  - ../../../base/podinfo
  - namespace.yaml
images:
  - name: ghcr.io/stefanprodan/podinfo
    newTag: 6.7.1 # CI bumps this line; the commit is the release, git revert is the rollback
labels:
  - pairs:
      env: staging
    includeSelectors: false
patches:
  - target:
      kind: ConfigMap
      name: podinfo
    patch: |-
      - op: replace
        path: /data/PODINFO_UI_MESSAGE
        value: "hello from staging"
  - target:
      kind: Ingress
      name: podinfo
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: podinfo-staging.localtest.me
