# Default deny: nothing reaches the pod and the pod reaches nothing, except what is listed below.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: podinfo-default-deny
spec:
  podSelector:
    matchLabels:
      app: podinfo
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: podinfo-allow
spec:
  podSelector:
    matchLabels:
      app: podinfo
  policyTypes: [Ingress, Egress]
  ingress:
    - from: # the ingress controller, on the app port only
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 9898
    - from: # Prometheus, on the metrics port only
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9797
  egress:
    - to: # DNS
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
