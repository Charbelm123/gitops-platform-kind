apiVersion: v1
kind: Service
metadata:
  name: podinfo
  labels:
    app: podinfo
spec:
  selector:
    app: podinfo
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics # declared so the metrics port is visible to policies and scrapers
      port: 9797
      targetPort: metrics
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: podinfo
